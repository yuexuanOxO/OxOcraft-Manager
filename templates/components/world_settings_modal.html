<div
    id="worldSettingsModal"
    class="world-settings-modal hidden"
>
    <div class="world-settings-panel">

        <div class="world-settings-side-tabs">

            <button
                class="world-settings-tab active"
                type="button"
                title="世界"
            >
                <img
                    src="/static/icons/feature_button/grass_block _btn.png"
                    alt=""
                >

                <span>世界</span>
            </button>

        </div>

        <div class="world-settings-main">

            <div class="world-settings-header">

                <div class="world-settings-title">
                    世界管理
                </div>

                <div class="world-settings-summary">
                    管理目前伺服器環境中的世界存檔
                </div>

            </div>

            <section class="world-settings-current-section">

                <div class="world-settings-section-header">

                    <div class="world-settings-section-title">
                        目前使用中的世界
                    </div>

                </div>

                <div
                    id="worldSettingsList"
                    class="world-settings-list world-settings-current-content"
                >
                    <div class="world-settings-empty">
                        尚未載入世界資料
                    </div>
                </div>

            </section>

            <div class="world-settings-content-grid">

                <section class="world-settings-world-list-panel">

                    <div class="world-settings-section-header">

                        <div class="world-settings-section-title">
                            世界存檔
                        </div>

                        <button
                            id="worldSettingsCreateBtn"
                            class="world-settings-create-button"
                            type="button"
                            disabled
                        >
                            建立新世界
                        </button>

                    </div>

                    <div
                        id="worldSettingsArchiveList"
                        class="world-settings-world-list"
                    >
                        <button
                            class="world-settings-world-item is-current is-selected"
                            type="button"
                        >
                            <img
                                class="world-settings-world-item-icon"
                                src="/static/icons/feature_button/grass_block _btn.png"
                                alt=""
                            >

                            <span class="world-settings-world-item-content">

                                <span class="world-settings-world-item-name-row">

                                    <span class="world-settings-world-item-name">
                                        目前世界
                                    </span>

                                    <span class="world-settings-world-current-badge">
                                        使用中
                                    </span>

                                </span>

                                <span class="world-settings-world-item-meta">
                                    世界資訊預覽
                                </span>

                            </span>
                        </button>

                        <button
                            class="world-settings-world-item"
                            type="button"
                        >
                            <img
                                class="world-settings-world-item-icon"
                                src="/static/icons/feature_button/grass_block _btn.png"
                                alt=""
                            >

                            <span class="world-settings-world-item-content">

                                <span class="world-settings-world-item-name">
                                    其他世界
                                </span>

                                <span class="world-settings-world-item-meta">
                                    世界資訊預覽
                                </span>

                            </span>
                        </button>
                    </div>

                </section>

                <section class="world-settings-detail-panel">

                    <div class="world-settings-section-header">

                        <div class="world-settings-section-title">
                            世界詳細資料
                        </div>

                    </div>

                    <div
                        id="worldSettingsDetail"
                        class="world-settings-detail-body"
                    >
                        <div class="world-settings-empty">
                            請從左側選取世界
                        </div>
                    </div>

                </section>

            </div>

        </div>

    </div>
</div>
